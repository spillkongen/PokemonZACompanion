<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />
  <title>Lumiose City Map</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #12121f; color: #fff; font-family: system-ui, sans-serif; }
    #viewport { width: 100%; height: 100%; overflow: auto; touch-action: pan-x pan-y pinch-zoom; }
    #map { display: block; width: 2400px; max-width: none; height: auto; margin: 0 auto; }
    #hint {
      position: fixed; left: 0; right: 0; bottom: 0;
      padding: 8px 12px; font-size: 12px; text-align: center;
      background: rgba(0,0,0,0.55); pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="viewport">
    <img id="map" src="lumiose.jpg" alt="Lumiose City map" />
  </div>
  <div id="hint">Pinch or scroll to explore · Offline map</div>
</body>
</html>
